<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — ABDULLAH DIGITAL STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <div class="logo-icon">A</div>
      <div>
        <div class="store-name">ABDULLAH <span>DIGITAL</span> STORE</div>
        <div style="font-size:0.7rem;color:var(--gray-600);">Admin Panel</div>
      </div>
    </div>
    <nav class="nav-tabs" id="mainNav">
      <button class="nav-tab active" data-page="dashboard">Dashboard</button>
      <button class="nav-tab" data-page="create">Create Invoice</button>
      <button class="nav-tab" data-page="products">Products</button>
      <a href="index.html" class="nav-tab">Public View</a>
    </nav>
    <span class="badge-admin">🔐 Admin</span>
  </header>

  <div class="container">

    <!-- DASHBOARD -->
    <section id="page-dashboard" class="page-section active">
      <div class="flex-between mb-3">
        <h2>All Invoices</h2>
        <button class="btn btn-primary" onclick="showPage('create')">+ New Invoice</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInvoiceInput" class="form-control"
               placeholder="Search by invoice number, customer or product...">
        <button class="btn btn-outline" onclick="searchInvoices()">Search</button>
      </div>
      <div id="invoiceListContainer" class="card">
        <div class="flex-center" style="padding:40px;color:var(--gray-600);">Loading…</div>
      </div>
    </section>

    <!-- CREATE INVOICE -->
    <section id="page-create" class="page-section">
      <div class="dashboard-grid">
        <div class="card">
          <h3 class="mb-3">Create New Invoice</h3>
          <div class="form-group">
            <label class="form-label">Customer Name (optional)</label>
            <input type="text" id="custName" class="form-control" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Customer Email (optional)</label>
            <input type="email" id="custEmail" class="form-control" placeholder="customer@email.com">
          </div>
          <div class="form-group">
            <label class="form-label">Telegram Username (optional)</label>
            <input type="text" id="custTelegram" class="form-control" placeholder="@username">
          </div>
          <h4 class="mt-3 mb-3">Select Products</h4>
          <div id="productSelectList"></div>
          <button class="btn btn-primary w-100 mt-3" onclick="generateInvoice()">
            Generate Invoice
          </button>
        </div>
        <div class="card" style="background:var(--gray-100);">
          <h3 class="mb-3">Live Preview</h3>
          <div id="livePreviewContainer" class="invoice-preview"
               style="padding:20px;box-shadow:none;">
            <div class="flex-center" style="padding:40px;color:var(--gray-600);">
              Select products to preview
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section id="page-products" class="page-section">
      <div class="flex-between mb-3">
        <h2>Product Management</h2>
        <button class="btn btn-primary" onclick="openAddProductModal()">+ Add Product</button>
      </div>
      <div id="productsListContainer" class="card"></div>
    </section>
  </div>

  <!-- MODAL: Add Product -->
  <div id="productModal" class="modal-overlay">
    <div class="modal-content">
      <h3 class="mb-3">➕ Add New Product</h3>
      <div class="form-group">
        <label class="form-label">Product Name *</label>
        <input type="text" id="newProductName" class="form-control"
               placeholder="e.g. X Premium, Canva Pro">
      </div>
      <div class="form-group">
        <label class="form-label">Custom Fields (comma separated)</label>
        <input type="text" id="newProductFields" class="form-control"
               placeholder="e.g. X Profile Link, Gmail Address">
        <small style="color:var(--gray-600);font-size:0.75rem;display:block;margin-top:4px;">
          Invoice বানানোর সময় এই field গুলো customer-এর কাছ থেকে নেওয়া হবে।
        </small>
      </div>
      <div class="flex gap-2 mt-3">
        <button class="btn btn-outline" onclick="closeModal('productModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveNewProduct()">💾 Save Product</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Delivery -->
  <div id="deliveryModal" class="modal-overlay">
    <div class="modal-content">
      <h3 class="mb-3">Add Delivery Information</h3>
      <div id="deliveryFormFields"></div>
      <div class="flex gap-2 mt-3">
        <button class="btn btn-outline" onclick="closeModal('deliveryModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveDeliveryInfo()">Save Delivery</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
